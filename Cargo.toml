[package]
name = "shiguredo_dav1d"
version = "2026.2.0"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for dav1d AV1 decoder"
readme = "README.md"
homepage = "https://github.com/shiguredo/dav1d-rs"
repository = "https://github.com/shiguredo/dav1d-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**/*"]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies.dav1d]
url = "https://github.com/videolan/dav1d"
version = "1.5.4"

[workspace]
members = [".", "pbt"]
# fuzz は cargo-fuzz が個別に管理するためワークスペースから除外する
exclude = ["fuzz"]

[dependencies]

[dev-dependencies]
# PSNR テストで AV1 エンコードに使用する AOM バインディング
shiguredo_aom = "2026.1"
# PSNR テストで AV1 エンコードに使用する SVT-AV1 バインディング
shiguredo_svt_av1 = "2026.1"

[build-dependencies]
# dav1d の C ヘッダーから Rust バインディングを生成する
bindgen = "0.72"
# Cargo.toml の [package.metadata.external-dependencies] を読み取る
shiguredo_toml = "2026.2"

[features]
source-build = []
